name: Deploy to EKS

on:
  push:
    branches:
      - main
      - master

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: devpulse-eks-cluster
  K8S_NAMESPACE: devpulse
  ECR_REPO_API: devpulse/api
  ECR_REPO_WORKER: devpulse/worker

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DevPulse.Api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DevPulse.Worker/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_WORKER }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_WORKER }}:latest
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Deploy API image to EKS
        run: |
          kubectl set image deployment/devpulse-api \
            devpulse-api=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/devpulse-api -n ${{ env.K8S_NAMESPACE }} --timeout=180s

      - name: Deploy Worker image to EKS
        run: |
          kubectl set image deployment/devpulse-worker \
            devpulse-worker=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_WORKER }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/devpulse-worker -n ${{ env.K8S_NAMESPACE }} --timeout=180s
