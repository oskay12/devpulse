apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpulse-api
  namespace: devpulse
  labels:
    app: devpulse-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devpulse-api
  template:
    metadata:
      labels:
        app: devpulse-api
    spec:
      containers:
        - name: devpulse-api
          image: 877766546073.dkr.ecr.us-east-1.amazonaws.com/devpulse/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DatabaseSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: devpulse-db-secret
                  key: DatabaseSettings__ConnectionString
            - name: OpenSearch__Endpoint
              valueFrom:
                configMapKeyRef:
                  name: devpulse-config
                  key: OpenSearch__Endpoint
            - name: OpenSearch__AuthMode
              valueFrom:
                configMapKeyRef:
                  name: devpulse-config
                  key: OpenSearch__AuthMode
            - name: OpenSearch__Username
              valueFrom:
                secretKeyRef:
                  name: devpulse-opensearch-secret
                  key: OpenSearch__Username
            - name: OpenSearch__Password
              valueFrom:
                secretKeyRef:
                  name: devpulse-opensearch-secret
                  key: OpenSearch__Password
            - name: RabbitMq__HostName
              valueFrom:
                configMapKeyRef:
                  name: devpulse-config
                  key: RabbitMq__HostName
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: devpulse-rabbitmq-secret
                  key: RabbitMq__Username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: devpulse-rabbitmq-secret
                  key: RabbitMq__Password
            - name: Webhooks__GitHubSecret
              valueFrom:
                secretKeyRef:
                  name: devpulse-webhook-secret
                  key: Webhooks__GitHubSecret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: devpulse-api
  namespace: devpulse
  labels:
    app: devpulse-api
spec:
  type: ClusterIP
  selector:
    app: devpulse-api
  ports:
    - name: http
      port: 80
      targetPort: http
